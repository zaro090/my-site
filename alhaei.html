[کد کامل اصلاح‌شده رو اینجا بذار]
<script>
// ===== کلید برگشت گوشی (نسخه جدید) =====
window.addEventListener('popstate', function() {
    const modal = document.getElementById('modalOverlay');
    if (modal.style.display === 'flex') {
        closeModal();
        return;
    }
    const customerPage = document.getElementById('customerPage');
    const listPage = document.getElementById('customerListPage');
    const statsPage = document.getElementById('statsPage');
    
    if (!customerPage.classList.contains('hidden')) {
        goBackFromCustomer();
        return;
    }
    if (!listPage.classList.contains('hidden')) {
        closeCustomerList();
        return;
    }
    if (!statsPage.classList.contains('hidden')) {
        closeStats();
        return;
    }
});

// تنظیم state اولیه
window.addEventListener('load', function() {
    history.replaceState({ page: 'main' }, '');
    renderMain();
    updateTotalDebt();
});
</script>
